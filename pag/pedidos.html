    <main>
        <section class="formulario-seccion">
            <h2>Realizá tu Pedido</h2>
            <form id="form-pedido">
                <!-- Opciones -->
                <label for="opcion">Elegí una opción:</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <select id="opcion" name="opcion">
                        <option value="remera">remera</option>
                        <option value="buzo">buzo</option>
                        <option value="vaso termico">vaso termico</option>
                        <option value="mate">mate</option>
                        <option value="termo">termo</option>
                        <option value="choperos">choperos</option>
                        <option value="destapadores">destapadores</option>
                        <option value="otro">otro</option>
                    </select>

                    <!-- Campo oculto que aparece al elegir "otro" -->
                    <input 
                        type="text" 
                        id="otro-producto" 
                        name="otro-producto" 
                        placeholder="Especificá el producto" 
                        style="display: none;"
                    >
                </div>

                <!-- Teléfono -->
                <label for="telefono">Número de teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 299-1234567" required>

                <!-- Detalles del producto -->
                <label for="detalles">Detalles/especificaciones</label>
                <textarea id="detalles" name="detalles" rows="4" cols="40" placeholder="Escribí aquí los detalles..."></textarea>

                <!-- Botón -->
                <input type="submit" value="Enviar pedido por WhatsApp">
            </form>
        </section>
    </main>
